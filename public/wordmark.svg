<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="40 15 680 250" role="img" aria-labelledby="wordmark-title wordmark-desc" version="1.1">
  <title id="wordmark-title">Strange Lasers</title>
  <desc id="wordmark-desc">Vivid purple STRANGE above cyan LASERS with a fine near-black outline. The cyan upper beam and purple lower beam pass behind the letters except through one leg of each A, with fine white cores and perpendicular cyan and purple flares. Each balanced four-point flare has long sharp tips and gently curved tapers, with an opaque white center of the same shape, colored edges, a fine near-black outline, and a soft glow. Transparent background.</desc>
  <defs>
    <filter id="wide-glow" filterUnits="userSpaceOnUse" x="-100" y="-100" width="960" height="530">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="tight-glow" filterUnits="userSpaceOnUse" x="-100" y="-100" width="960" height="530">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <mask id="strange-angle-a-through-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="760" height="280">
      <rect width="760" height="280" fill="white"/>
      <line x1="377" y1="84.1" x2="427" y2="82.1" stroke="black" stroke-width="8"/>
    </mask>
    <mask id="lasers-angle-a-through-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="760" height="280">
      <rect width="760" height="280" fill="white"/>
      <line x1="180" y1="192.1" x2="228" y2="194" stroke="black" stroke-width="8"/>
    </mask>
    <linearGradient id="cyan-beam" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="700" y2="0">
      <stop offset="0" stop-color="#11bfe9"/>
      <stop offset="0.5" stop-color="#78ebff"/>
      <stop offset="1" stop-color="#11bfe9"/>
    </linearGradient>
    <linearGradient id="purple-beam" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="700" y2="0">
      <stop offset="0" stop-color="#7857ff"/>
      <stop offset="0.5" stop-color="#a19af7"/>
      <stop offset="1" stop-color="#7857ff"/>
    </linearGradient>
  </defs>
